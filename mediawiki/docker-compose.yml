services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: mediawiki
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: mediawiki
      MYSQL_PASSWORD: mediawiki
    volumes:
      - db_data:/var/lib/mysql

  mediawiki:
    image: mediawiki:1.45
    ports:
      - "8180:80"
    volumes:
      - mw_data:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
  mw_data:
